[pytest]
# Root pytest config so running from repo root is reliable.
# (Without this, `pytest backend/tests/...` may not pick up backend/pytest.ini.)

testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
console_output_style = classic

# Keep output useful but avoid "hang-like" slow steps by default (HTML coverage generation).
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=term-missing

filterwarnings =
    # Suppress gzip cleanup warnings from GZipMiddleware in tests (Python 3.14+ issue)
    ignore::pytest.PytestUnraisableExceptionWarning
    # Suppress deprecation warnings from dependencies
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning

markers =
    unit: Unit tests
    integration: Integration tests
    auth: Authentication tests
    api: API endpoint tests
    cache: Cache-related tests
    visualization: Visualization safety tests

